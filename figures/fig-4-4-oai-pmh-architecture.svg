<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
>
  <defs>
    <style>
      :root {
        --ink: #222222;
        --muted: #5f5f5f;
        --line: #2a2a2a;
        --panel: #ffffff;
        --soft: #f7f7f7;
      }

      .canvas {
        fill: #ffffff;
      }

      .box {
        fill: var(--panel);
        stroke: var(--line);
        stroke-width: 2;
        rx: 18;
        ry: 18;
      }

      .hub {
        fill: var(--soft);
        stroke: var(--line);
        stroke-width: 2.4;
        rx: 18;
        ry: 18;
      }

      .title {
        font-family: "Async Sans", sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: var(--ink);
      }

      .label {
        font-family: "Async Sans", sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: var(--muted);
      }

      .arrow {
        stroke: var(--line);
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        marker-end: url(#arrowhead);
      }
    </style>

    <marker
      id="arrowhead"
      markerWidth="10"
      markerHeight="8"
      refX="9"
      refY="4"
      orient="auto"
      markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#2a2a2a"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1200" height="520"/>

  <!-- Source system -->
  <rect class="hub" x="60" y="210" width="220" height="100"/>
  <text class="title" x="170" y="250" text-anchor="middle">CEDVU</text>
  <text class="label" x="170" y="278" text-anchor="middle">autoritatívne dáta</text>

  <!-- OAI-PMH providers -->
  <rect class="box" x="380" y="80" width="260" height="86"/>
  <text class="title" x="510" y="116" text-anchor="middle">OAI-PMH provider</text>
  <text class="label" x="510" y="142" text-anchor="middle">SNG</text>

  <rect class="box" x="380" y="217" width="260" height="86"/>
  <text class="title" x="510" y="253" text-anchor="middle">OAI-PMH provider</text>
  <text class="label" x="510" y="279" text-anchor="middle">regionálna galéria</text>

  <rect class="box" x="380" y="354" width="260" height="86"/>
  <text class="title" x="510" y="390" text-anchor="middle">OAI-PMH provider</text>
  <text class="label" x="510" y="416" text-anchor="middle">ďalšia inštitúcia</text>

  <!-- Harvester -->
  <rect class="hub" x="750" y="210" width="220" height="100"/>
  <text class="title" x="860" y="250" text-anchor="middle">spice-harvester</text>
  <text class="label" x="860" y="278" text-anchor="middle">priebežný zber dát</text>

  <!-- Web umenia -->
  <rect class="hub" x="1030" y="210" width="130" height="100"/>
  <text class="title" x="1095" y="250" text-anchor="middle">Web</text>
  <text class="title" x="1095" y="274" text-anchor="middle">umenia</text>

  <!-- Arrows: CEDVU to providers -->
  <line class="arrow" x1="280" y1="260" x2="380" y2="123"/>
  <line class="arrow" x1="280" y1="260" x2="380" y2="260"/>
  <line class="arrow" x1="280" y1="260" x2="380" y2="397"/>

  <!-- Arrows: providers to harvester -->
  <line class="arrow" x1="640" y1="123" x2="750" y2="230"/>
  <line class="arrow" x1="640" y1="260" x2="750" y2="260"/>
  <line class="arrow" x1="640" y1="397" x2="750" y2="290"/>

  <!-- Arrow: harvester to Web umenia -->
  <line class="arrow" x1="970" y1="260" x2="1030" y2="260"/>
</svg>
