<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="720"
  viewBox="0 0 1200 720"
>
  <defs>
    <style>
      :root {
        --ink: #222222;
        --muted: #5f5f5f;
        --line: #2a2a2a;
        --panel: #ffffff;
        --soft: #f7f7f7;
      }

      .canvas {
        fill: #ffffff;
      }

      .area {
        fill: #ffffff;
        stroke: var(--line);
        stroke-width: 2;
        stroke-dasharray: 6 7;
        rx: 18;
        ry: 18;
      }

      .box {
        fill: var(--panel);
        stroke: var(--line);
        stroke-width: 2;
        rx: 18;
        ry: 18;
      }

      .soft {
        fill: var(--soft);
        stroke: var(--line);
        stroke-width: 2;
        rx: 18;
        ry: 18;
      }

      .title {
        font-family: "Async Sans", sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: var(--ink);
      }

      .label {
        font-family: "Async Sans", sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: var(--muted);
      }

      .arrow {
        stroke: var(--line);
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        marker-end: url(#arrowhead);
      }

      .flow {
        font-family: "Async Sans", sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: var(--muted);
      }
    </style>

    <marker
      id="arrowhead"
      markerWidth="10"
      markerHeight="8"
      refX="9"
      refY="4"
      orient="auto"
      markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#2a2a2a"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1200" height="720"/>

  <!-- Areas -->
  <rect class="area" x="60" y="80" width="430" height="560"/>
  <text class="title" x="90" y="122" text-anchor="start">Záhrada</text>
  <text class="label" x="90" y="148" text-anchor="start">prechádzka / serendipita</text>

  <rect class="area" x="520" y="80" width="620" height="560"/>
  <text class="title" x="550" y="122" text-anchor="start">Domček</text>
  <text class="label" x="550" y="148" text-anchor="start">sústredenie / výber / zvuk</text>

  <!-- Garden steps -->
  <rect class="soft" x="90" y="190" width="370" height="120"/>
  <text class="title" x="275" y="240" text-anchor="middle">Prechádzka</text>
  <text class="label" x="275" y="268" text-anchor="middle">zmena vnímania</text>

  <rect class="soft" x="90" y="370" width="370" height="120"/>
  <text class="title" x="275" y="420" text-anchor="middle">Nájdenie predmetu</text>
  <text class="label" x="275" y="448" text-anchor="middle">osobný vstup</text>

  <!-- Arrow between garden steps -->
  <line class="arrow" x1="275" y1="310" x2="275" y2="370"/>

  <!-- Arrow from garden to house -->
  <line class="arrow" x1="490" y1="430" x2="520" y2="430"/>

  <!-- Workstation -->
  <rect class="soft" x="560" y="190" width="540" height="310"/>
  <text class="title" x="830" y="230" text-anchor="middle">Pracovný stôl + lightbox</text>

  <!-- Speakers placed at the back of the table -->
  <rect class="box" x="600" y="255" width="140" height="36" rx="12" ry="12"/>
  <text class="label" x="670" y="278" text-anchor="middle">reproduktor</text>

  <rect class="box" x="920" y="255" width="140" height="36" rx="12" ry="12"/>
  <text class="label" x="990" y="278" text-anchor="middle">reproduktor</text>

  <!-- Webcam -->
  <rect class="box" x="785" y="255" width="90" height="36" rx="12" ry="12"/>
  <text class="label" x="830" y="278" text-anchor="middle">webkamera</text>
  <line class="arrow" x1="830" y1="291" x2="790" y2="335"/>

  <!-- Lightbox -->
  <rect class="box" x="590" y="335" width="255" height="115"/>
  <text class="title" x="718" y="383" text-anchor="middle">Lightbox</text>
  <text class="label" x="718" y="411" text-anchor="middle">predmet ako vstup</text>

  <!-- Display -->
  <rect class="box" x="875" y="335" width="195" height="115"/>
  <text class="title" x="973" y="383" text-anchor="middle">Displej</text>
  <text class="label" x="973" y="411" text-anchor="middle">výber z Webu umenia</text>

  <!-- Arrow lightbox to display -->
  <line class="arrow" x1="845" y1="393" x2="875" y2="393"/>

  <!-- Output -->
  <rect class="soft" x="560" y="530" width="540" height="90"/>
  <text class="title" x="830" y="568" text-anchor="middle">Materializácia</text>
  <text class="label" x="830" y="596" text-anchor="middle">vytlačený diptych</text>

  <!-- Arrow workstation to output -->
  <line class="arrow" x1="830" y1="500" x2="830" y2="530"/>

  <!-- Simplified flow -->
  <rect class="box" x="220" y="665" width="760" height="40" rx="14" ry="14"/>
  <text class="flow" x="600" y="690" text-anchor="middle">
    nález → podobnosť → kandidáti → rozhodnutie → diptych
  </text>
</svg>
